name: CI

# Pull requests run Linux on both Node versions plus macOS and Windows on Node 24. A push to main repeats what
# its squash-merged pull request already passed, so it runs Linux only. Every OS on both Node versions runs on
# demand (workflow_dispatch) and before each release (publish.yml). Changes to prose only (the root Markdown
# files, docs/ except the generated references, the showreel) skip CI.

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!*.md"
      - "!docs/**"
      - "docs/CLI.md"
      - "docs/TOOLS.md"
      - "!tools/showreel/**"
  pull_request:
    paths:
      - "**"
      - "!*.md"
      - "!docs/**"
      - "docs/CLI.md"
      - "docs/TOOLS.md"
      - "!tools/showreel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      matrix: >-
        ${{
          github.event_name == 'push' && '[{"os":"ubuntu-latest","node":24}]' ||
          github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","node":22},{"os":"ubuntu-latest","node":24},{"os":"macos-latest","node":24},{"os":"windows-latest","node":24}]' ||
          '[{"os":"ubuntu-latest","node":22},{"os":"ubuntu-latest","node":24},{"os":"macos-latest","node":24},{"os":"windows-latest","node":22},{"os":"windows-latest","node":24}]'
        }}

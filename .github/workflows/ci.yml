name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: scaffold smoke test
        shell: bash
        run: |
          node packages/cli/dist/main.js init --new --dir "$RUNNER_TEMP/kb"
          cd "$RUNNER_TEMP/kb"
          node "$GITHUB_WORKSPACE/packages/cli/dist/main.js" lint
          node "$GITHUB_WORKSPACE/packages/cli/dist/main.js" search obsidian | head -3

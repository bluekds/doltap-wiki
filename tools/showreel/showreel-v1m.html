/* ---------------- math / easing ---------------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;

const easeOutBack = (t, s = 1.70158) => { const c3 = s + 1; return 1 + c3 * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const easeInBack = (t, s = 1.70158) => (s + 1) * t * t * t - s * t * t;
const easeOutElastic = t => { if (t <= 0) return 0; if (t >= 1) return 1; const c4 = 2 * Math.PI / 3; return Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * c4) + 1; };

// start offset (frames) of element `index` among `n` spread over `span` frames

const spring = (t, k = 7, w = 11) => t <= 0 ? 0 : t >= 1 ? 1 - Math.exp(-k) * Math.cos(w) * (1 - t) : 1 - Math.exp(-k * t) * Math.cos(w * t);

const hexRgb = h => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };

function track(i, keys) {

/* ---------------- geometry helpers ---------------- */
const PM = 72;
const PTS_CACHE = new Map();
function superPts(w, h, nT, nB, seed, irr) {
  const key = [w, h, nT, nB, seed, irr].join('|'); if (PTS_CACHE.has(key)) return PTS_CACHE.get(key);
  const r = rng(seed * 9973 + 17); const p1 = r() * 6.283, p2 = r() * 6.283, p3 = r() * 6.283;
  const a1 = (.025 + r() * .02) * irr, a2 = (.015 + r() * .018) * irr, a3 = .01 * irr; const pts = [];
  for (let k = 0; k < PM; k++) {
    const th = k / PM * Math.PI * 2, c = Math.cos(th), s = Math.sin(th), n = s < 0 ? nT : nB;
    const x = (w / 2) * Math.sign(c) * Math.pow(Math.abs(c), 2 / n), y = (h / 2) * Math.sign(s) * Math.pow(Math.abs(s), 2 / n);
    const m = 1 + a1 * Math.sin(2 * th + p1) + a2 * Math.sin(3 * th + p2) + a3 * Math.sin(5 * th + p3);
    pts.push([x * m, y * m]);
  }
  PTS_CACHE.set(key, pts); return pts;
}
const stonePts = s => superPts(s.w, s.h, 2.3, 3.2, s.seed, 1);
const circlePts = r => superPts(2 * r, 2 * r, 2, 2, 0, 0);
const lerpPts = (a, b, t) => a.map((p, k) => [lerp(p[0], b[k][0], t), lerp(p[1], b[k][1], t)]);
function tracePts(pts) {
  const M = pts.length; ctx.beginPath();
  ctx.moveTo((pts[M - 1][0] + pts[0][0]) / 2, (pts[M - 1][1] + pts[0][1]) / 2);
  for (let k = 0; k < M; k++) { const p = pts[k], q = pts[(k + 1) % M]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
  ctx.closePath();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function glow(x, y, r, col, a) {
  if (a <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r);

}

const monoF = (px, wt = 400) => `${wt} ${px}px ${MONO}`;

/* stone body at local origin (centre). o: shade, shadow, glow, seed */
function stoneBody(pts, w, h, color, o = {}) {
  const shade = o.shade ?? 1, sh = o.shadow ?? 1;
  if (sh > 0) {
    ctx.save(); ctx.translate(0, h * .44); ctx.scale(1, .17);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, w * .58); g.addColorStop(0, `rgba(3,8,14,${.6 * sh})`); g.addColorStop(1, 'rgba(3,8,14,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, w * .58, 0, 7); ctx.fill(); ctx.restore();
  }
  if (o.glow > 0) { ctx.save(); ctx.shadowColor = rgba(C.green, Math.min(1, o.glow)); ctx.shadowBlur = 70 * o.glow; tracePts(pts); ctx.fillStyle = color; ctx.fill(); ctx.restore(); }
  tracePts(pts); ctx.fillStyle = color; ctx.fill();
  if (shade > 0) {
    ctx.save(); tracePts(pts); ctx.clip(); ctx.globalAlpha *= shade;
    let g = ctx.createRadialGradient(-w * .2, -h * .5, 0, -w * .2, -h * .5, w * .72);
    g.addColorStop(0, 'rgba(255,255,255,0.30)'); g.addColorStop(.45, 'rgba(255,255,255,0.07)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(-w, -h, 2 * w, 2 * h);
    g = ctx.createLinearGradient(0, -h * .05, 0, h * .55); g.addColorStop(0, 'rgba(8,14,24,0)'); g.addColorStop(1, 'rgba(8,14,24,0.45)');
    ctx.fillStyle = g; ctx.fillRect(-w, -h, 2 * w, 2 * h);
    const r = rng((o.seed || 1) * 31 + 5);
    ctx.fillStyle = 'rgba(30,26,22,0.16)';
    for (let k = 0; k < 24; k++) { const x = (r() - .5) * w * .85, y = (r() - .5) * h * .7, s = .8 + r() * 2.2; ctx.beginPath(); ctx.arc(x, y, s, 0, 7); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    for (let k = 0; k < 10; k++) { const x = (r() - .5) * w * .8, y = (r() - .7) * h * .5, s = .6 + r() * 1.4; ctx.beginPath(); ctx.arc(x, y, s, 0, 7); ctx.fill(); }
    ctx.strokeStyle = 'rgba(255,255,255,0.17)'; ctx.lineWidth = 3; ctx.translate(0, 2.6); tracePts(pts); ctx.stroke();
    ctx.restore();
  }
}
/* stone with squash anchored at its bottom */
function drawStone(x, y, s, o = {}) {
  const w = o.w ?? s.w, h = o.h ?? s.h, pts = o.pts || stonePts(s);
  ctx.save(); ctx.globalAlpha *= (o.a ?? 1);
  ctx.translate(x, y + h / 2); ctx.rotate(o.rot ?? s.rot ?? 0); ctx.scale(o.sx ?? 1, o.sy ?? 1); ctx.translate(0, -h / 2);
  if (o.scale) ctx.scale(o.scale, o.scale);

/* ---------------- camera + shake ---------------- */
// monotone cubic (Fritsch-Carlson style) through camera keys: no stop-and-go at every key,
// no overshoot, and keys that start/end a hold get zero velocity.
function camTangent(k, c) {
  if (k === 0 || k === CAM.length - 1) return 0;
  const p = CAM[k - 1], q = CAM[k], r = CAM[k + 1];
  const d0 = (q[c] - p[c]) / (q[0] - p[0]), d1 = (r[c] - q[c]) / (r[0] - q[0]);
  if (d0 * d1 <= 0) return 0;
  return 2 / (1 / d0 + 1 / d1); // harmonic mean keeps it monotone
}
function camAt(i) {
  if (i <= CAM[0][0]) i = CAM[0][0];
  let k = CAM.length - 2; for (let n = 1; n < CAM.length; n++) if (i <= CAM[n][0]) { k = n - 1; break; }
  const a = CAM[k], b = CAM[k + 1], dt = b[0] - a[0], u = clamp((i - a[0]) / dt);
  const h00 = 2 * u * u * u - 3 * u * u + 1, h10 = u * u * u - 2 * u * u + u, h01 = -2 * u * u * u + 3 * u * u, h11 = u * u * u - u * u;
  const v = c => h00 * a[c] + h10 * dt * camTangent(k, c) + h01 * b[c] + h11 * dt * camTangent(k + 1, c);
  return { x: v(1), y: v(2), s: v(3), rot: v(4) };
}
function shakeAt(i) {
  let x = 0, y = 0;
  for (const e of SHAKE) { const age = i - e.L; if (age < 0 || age > 9) continue; const d = e.amp * Math.pow(1 - age / 9, 2); x += d * Math.sin(age * 2.9 + e.L); y += d * Math.cos(age * 3.7 + e.L * .5); }
  return [x, y];
}

const GRAIN = [];
function makeGrain() {
  const r = rng(4242);
  for (let n = 0; n < 4; n++) {
    const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');

    g.putImageData(id, 0, 0); GRAIN.push(ctx.createPattern(c, 'repeat'));
  }
}
const MOTES = (() => { const r = rng(777); return Array.from({ length: 70 }, () => ({ x: r() * 2300, y: r() * 1200, z: .4 + r() * .8, s: .8 + r() * 2.2, ph: r() * 6.28, a: .05 + r() * .13 })); })();

    ctx.fillStyle = `rgba(217,212,206,${m.a})`; ctx.beginPath(); ctx.arc(x, y, m.s, 0, 7); ctx.fill();
  }

/* =====================================================================
   S6 — logo & title

}
function logoStoneAt(j, i) {

}
function drawS6(i, layer) {
  if (layer === 'ui') { drawTitle(i); return; }
  if (layer !== 'front') return;

  glow(960, 300, 400, C.green, br);

  if (xf < 1) {
    ctx.save(); ctx.globalAlpha *= 1 - xf;

      const st = logoStoneAt(j, i); if (i < (j === 0 ? 360 : L.land - 8)) {

        ctx.save(); ctx.translate(n.x, n.y + SCROLL(360) + wob); stoneBody(circlePts(n.r), n.r * 2, n.r * 2, n.color || mixA(CAIRN[L.src].color, C.hi, .25), { shade: .4, shadow: 0, seed: 1, glow: j === 3 ? .4 : 0 }); ctx.restore(); return; }
      const pts0 = circlePts(NODES[L.src].r), pts1 = superPts(L.W, L.H, L.nT, L.nB, L.seed, .35);
      const m = easeInOutCubic(st.u);
      const pts = lerpPts(pts0, pts1, m), w = lerp(NODES[L.src].r * 2, L.W, m), h = lerp(NODES[L.src].r * 2, L.H, m);
      let sx = 1, sy = 1; if (st.u < 1) { sy = 1 + .1 * st.u; sx = 1 - .06 * st.u; } else { const q = squashAt(i - L.land, L.hash ? .14 : .1); sx = 1 + q; sy = 1 - q; }
      ctx.save(); ctx.translate(st.x, st.y + h / 2); ctx.rotate(L.rot * m); ctx.scale(sx, sy); ctx.translate(0, -h / 2);
      const shade = (1 - .7 * seg(i, 380, 388));

      if (L.hash && i >= L.land) { const hp = easeOutBack(seg(i, L.land + 1, L.land + 9), 2.6); ctx.save(); ctx.scale(LOGO.S * hp, LOGO.S * hp); ctx.rotate(-L.rot); hashGlyph(clamp(hp)); ctx.restore(); }

  chars.forEach((ch, k) => { if (ch === ' ') return; const t0 = T.title + k * 2, p = seg(i, t0, t0 + 12); if (p <= 0) return;
